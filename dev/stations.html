<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Starman Reborn · Station Exteriors (dev)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04060b;
        color: #e8eef8;
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 10px;
        left: 10px;
        width: 260px;
        max-height: calc(100% - 20px);
        overflow: auto;
        background: rgba(9, 15, 28, 0.86);
        border: 1px solid rgba(126, 170, 255, 0.24);
        border-radius: 10px;
        padding: 10px 12px;
        box-sizing: border-box;
      }
      #panel.hidden {
        display: none;
      }
      #panel h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      #panel label {
        display: block;
        margin: 8px 0 2px;
        color: #a3b3cb;
      }
      #panel select,
      #panel button,
      #panel input[type='range'],
      #panel input[type='number'],
      #panel input[type='text'] {
        width: 100%;
        box-sizing: border-box;
      }
      #panel select,
      #panel button,
      #panel input[type='number'],
      #panel input[type='text'] {
        background: #0a1120;
        color: #e8eef8;
        border: 1px solid rgba(126, 170, 255, 0.35);
        border-radius: 6px;
        padding: 5px 6px;
      }
      #panel button {
        margin-top: 6px;
        cursor: pointer;
      }
      #panel .row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 6px;
      }
      #panel .row label {
        margin: 0;
        color: #e8eef8;
      }
      #panel .row button,
      #panel .row input[type='number'] {
        margin-top: 0;
      }
      #stats {
        margin-top: 10px;
        color: #7485a0;
        font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre;
      }
      #title {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
      }
      #title .name {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #title .sub {
        font-size: 13px;
        color: #b8c6dc;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .tag {
        position: absolute;
        transform: translate(-50%, 0);
        text-align: center;
        white-space: nowrap;
        font-size: 11px;
        line-height: 1.25;
        text-shadow: 0 1px 2px #000, 0 0 4px #000;
      }
      .tag b {
        font-size: 12px;
      }
      .tag span {
        color: #a9b8cf;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="title"></div>
    <div id="panel"></div>
    <script type="module" src="../src/dev/stationGallery.ts"></script>
  </body>
</html>
