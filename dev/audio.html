<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Audio Lab</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #04060b;
        --panel: #0c1220;
        --line: #1c2740;
        --text: #e8eef8;
        --muted: #8b98b3;
        --accent: #5fb3ff;
        --good: #5fd49a;
        --warn: #ffb45f;
        --bad: #ff6f6f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      h1 { font-size: 20px; margin: 0 auto 0 0; }
      h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
      button {
        background: #13203a; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
        padding: 9px 12px; font: inherit; cursor: pointer; min-height: 40px; touch-action: manipulation;
      }
      button:hover { border-color: var(--accent); }
      button.on { background: #173a62; border-color: var(--accent); }
      button.primary { background: var(--accent); color: #04060b; border-color: var(--accent); font-weight: 600; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
      .grid button { text-align: left; }
      .grid button small { display: block; color: var(--muted); font-size: 11px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
      label.slider { display: grid; grid-template-columns: 110px 1fr 48px; gap: 8px; align-items: center; min-width: 260px; flex: 1; }
      label.slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      .badge { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
      .badge.running { color: var(--good); border-color: var(--good); }
      .badge.locked { color: var(--warn); border-color: var(--warn); }
      .badge.unavailable { color: var(--bad); border-color: var(--bad); }
      .note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
      #stats { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
      th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
      td.num { text-align: right; }
      td.bad { color: var(--bad); }
    </style>
  </head>
  <body>
    <main id="lab"></main>
    <script type="module" src="../src/dev/audioLab.ts"></script>
  </body>
</html>
